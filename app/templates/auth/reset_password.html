{% extends "base.html" %}
{% block title %}Reset Password - {{ site.name }}{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <h1 style="font-size:1.5rem">Set a New Password</h1>
    <form method="post">
      <div class="form-group"><label>New Password *</label><input type="password" name="password" required></div>
      <div class="form-group"><label>Confirm Password *</label><input type="password" name="confirm_password" required></div>
      <button class="btn btn-secondary btn-lg" style="width:100%" type="submit">Reset Password</button>
    </form>
  </div>
</div>
{% endblock %}
