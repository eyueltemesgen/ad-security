{% extends "base.html" %}
{% block title %}Login - {{ site.name }}{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="text-center" style="margin-bottom:16px">
      <h1 style="font-size:1.6rem">Customer Login</h1>
      <p class="text-muted">Welcome back to {{ site.name }}</p>
    </div>
    <form method="post">
      <div class="form-group"><label>Email</label><input type="email" name="email" required autofocus></div>
      <div class="form-group"><label>Password</label><input type="password" name="password" required></div>
      <div class="checkbox-line" style="margin-bottom:16px">
        <input type="checkbox" name="remember" id="remember"><label for="remember" class="fw-600">Remember me</label>
      </div>
      <button class="btn btn-secondary btn-lg" style="width:100%" type="submit">Log in</button>
    </form>
    <div class="flex-between" style="margin-top:16px">
      <a href="{{ url_for('auth.forgot_password') }}">Forgot password?</a>
      <a href="{{ url_for('auth.register') }}">Create account</a>
    </div>
    <hr style="margin:18px 0;border-color:rgba(0,0,0,.08)">
    <p class="text-center text-muted" style="margin:0;font-size:.9rem">
      Are you an administrator? <a href="{{ url_for('admin.login') }}"><strong>Admin Login</strong></a>
    </p>
  </div>
</div>
{% endblock %}
