{% extends "admin/base.html" %}
{% block title %}Navigation{% endblock %}
{% block heading %}Navigation Menu{% endblock %}
{% block content %}
<div class="panel" style="max-width:820px">
  <h3>Add Menu Item</h3>
  <form method="post" action="{{ url_for('admin.navigation_add') }}">
    <div class="form-row">
      <div class="form-group"><label>Label *</label><input type="text" name="label" required></div>
      <div class="form-group"><label>Link *</label><input type="text" name="url" placeholder="e.g. /products or https://..." required></div>
      <div class="form-group"><label>Order</label><input type="number" name="sort_order" value="0"></div>
    </div>
    <div class="checkbox-line" style="margin-bottom:10px"><input type="checkbox" name="is_visible" checked><label>Visible</label></div>
    <button class="btn btn-accent btn-sm">Add Item</button>
  </form>
</div>
<div class="panel" style="max-width:820px">
  <table class="data">
    <thead><tr><th>Menu Item</th><th>Status</th><th></th></tr></thead>
    <tbody>
      {% for n in items %}
      <tr>
        <td data-label="Menu Item"><form method="post" action="{{ url_for('admin.navigation_edit', item_id=n.id) }}" class="flex gap-2" style="flex-wrap:wrap">
          <input type="text" name="label" value="{{ n.label }}" style="min-width:140px">
          <input type="text" name="url" value="{{ n.url }}" style="flex:1;min-width:180px">
          <input type="number" name="sort_order" value="{{ n.sort_order }}" style="width:60px" title="Order">
          <label class="checkbox-line"><input type="checkbox" name="is_visible" {% if n.is_visible %}checked{% endif %}> Visible</label>
          <button class="btn btn-sm btn-outline">Save</button></form></td>
        <td data-label="Status">{% if n.is_visible %}<span class="status-badge status-completed">Live</span>{% else %}<span class="status-badge status-cancelled">Hidden</span>{% endif %}</td>
        <td data-label=""><form method="post" action="{{ url_for('admin.navigation_delete', item_id=n.id) }}" data-confirm="Remove this menu item?"><button class="btn btn-sm btn-outline" style="color:var(--danger);border-color:var(--danger)">✕</button></form></td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
