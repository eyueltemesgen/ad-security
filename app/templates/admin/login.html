<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login · {{ site.name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="admin-login">
  <div class="card auth-card">
    <div class="text-center" style="margin-bottom:18px">
      <img src="{{ site.logo }}" alt="" style="height:60px;margin:0 auto 12px;border-radius:8px">
      <h1 style="font-size:1.4rem">Admin Dashboard</h1>
      <p class="text-muted" style="margin:0">Sign in to manage {{ site.name }}</p>
    </div>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}<div class="alert alert-{{ category }}">{{ message }}</div>{% endfor %}
    {% endwith %}
    <form method="post">
      <div class="form-group"><label>Admin Email</label><input type="email" name="email" required autofocus></div>
      <div class="form-group"><label>Password</label><input type="password" name="password" required></div>
      <button class="btn btn-secondary btn-lg" style="width:100%" type="submit">Log In</button>
    </form>
    <p class="text-center" style="margin-top:14px;font-size:.85rem"><a href="{{ url_for('main.home') }}">← Back to website</a></p>
  </div>
</div>
</body>
</html>
